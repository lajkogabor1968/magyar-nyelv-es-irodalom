<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magyar nyelv és irodalom</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf8f2; color: #282c26; font: 1.125rem/1.55 system-ui, sans-serif; }
    main { max-width: 58rem; margin: auto; padding: clamp(2rem, 7vw, 6rem) 1.25rem; }
    h1, h2 { font-family: Georgia, serif; line-height: 1.1; }
    h1 { font-size: clamp(2.4rem, 7vw, 4.6rem); font-weight: normal; margin: 0 0 2.5rem; }
    h2 { font-size: 1.7rem; margin: 0 0 1.25rem; }
    .subjects { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,18rem),1fr)); gap: 2rem; }
    section { border-top: 3px solid #365e50; padding-top: 1.1rem; }
    section + section { border-color: #975139; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border-bottom: 1px solid #d4d2c8; }
    a { color: #204c40; display: block; padding: .85rem .25rem; text-decoration: none; }
    a strong { text-decoration: underline; text-underline-offset: .22em; }
    a span { display: block; color: #4d514a; font-size: 1rem; margin-top: .25rem; }
    a:hover { background: #eeefe7; }
    a:focus-visible { outline: 3px solid #245d88; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Magyar nyelv és irodalom</h1>
    <div class="subjects">
      <section aria-labelledby="nyelv"><h2 id="nyelv">Magyar nyelv</h2>
        <ul>
          <li><a href="https://lajkogabor1968.github.io/abece-kaland/"><strong>Ábécé-kaland</strong><span>A magyar ábécé és a betűrend gyakorlása.</span></a></li>
          <li><a href="https://lajkogabor1968.github.io/abece-kaland/betusziget/"><strong>Betűsziget</strong><span>Helyesírási kaland.</span></a></li>
        </ul>
      </section>
      <section aria-labelledby="irodalom"><h2 id="irodalom">Irodalom</h2>
        <ul>
          <li><a href="https://lajkogabor1968.github.io/abece-kaland/kosztolanyi-tintalabor/"><strong>Kosztolányi Tintalabor</strong><span>Irodalmi küldetés Kosztolányival.</span></a></li>
          <li><a href="https://lajkogabor1968.github.io/english-adventure/irodalom7/"><strong>Irodalmi kaland – 7. osztály</strong><span>A középkortól a Rómeó és Júliáig.</span></a></li>
        </ul>
      </section>
    </div>
  </main>
</body>
</html>
